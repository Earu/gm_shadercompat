name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: ./build.sh
      - run: |
          mkdir dist
          tar -czf dist/gm_shadercompat-linux-x86_64.tar.gz -C target/release gm_shadercompat
      - uses: actions/upload-artifact@v4
        with:
          name: gm_shadercompat-linux-x86_64
          path: dist/*

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable-msvc --profile minimal; rustup default stable-msvc
      - run: .\build.ps1
      - name: smoke test
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          Set-Content smoke\pass_ps30.hlsl "sampler S : register(s0);`nfloat4 main(float2 uv : TEXCOORD0) : COLOR { return tex2Dlod(S, float4(uv, 0, 0)); }"
          Set-Content smoke\fail_ps30.hlsl "sampler3D V : register(s0);`nfloat4 main(float3 uvw : TEXCOORD0) : COLOR { return tex3Dlod(V, float4(uvw, 0)); }"
          target\release\gm_shadercompat.exe smoke\pass_ps30.hlsl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = target\release\gm_shadercompat.exe --format json smoke\fail_ps30.hlsl
          if ($LASTEXITCODE -ne 1 -or -not ($out -match '"code":"tex3dlod"')) { $out; exit 1 }
          exit 0
      - run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\gm_shadercompat.exe dist\gm_shadercompat-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gm_shadercompat-windows-x86_64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
